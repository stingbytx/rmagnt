<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Not found — Remy Agent</title>
<style>
  :root{--paper:#F4F3F0;--ink:#0B0B0B;--line:rgba(11,11,11,.16);--mono:"IBM Plex Mono",ui-monospace,monospace}
  body{margin:0;min-height:100dvh;display:grid;place-items:center;background:var(--paper);color:var(--ink);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  .box{padding:40px;border:1px solid var(--line);max-width:460px;display:grid;gap:14px}
  .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:#75736D}
  h1{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:42px;line-height:1;margin:0}
  p{margin:0;color:#75736D;font-size:14px;line-height:1.6}
  a{display:inline-block;margin-top:6px;padding:11px 16px;background:var(--ink);color:var(--paper);
    font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;text-decoration:none}
</style>
</head>
<body>
  <div class="box">
    <span class="k">Error 404</span>
    <h1>Nothing lives here.</h1>
    <p>The page you asked for is not part of Remy Agent. The voice interface is a single page — everything else lives behind the hash router.</p>
    <a href="./">Back to the app</a>
  </div>
  <script>
    // If the request was a hash-route deep link, send it home.
    if (location.pathname !== '/') setTimeout(function(){ location.replace('./'); }, 10);
  </script>
</body>
</html>
